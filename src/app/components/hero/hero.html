<section class="hero">
  <div class="hero-window window-card">
    <div class="hero-layout">
      <div class="window-content">
        <h1>Anna Shalaginova</h1>
        <p class="subtitle">Creative Product Manager / Business Intelligence Analyst</p>
        <div class="hero-description">
          <p>I build digital experiences with precision and playfulness.</p>
          <p>Based in Greater Boston Area.</p>
        </div>
        <div class="hero-actions">
          <a href="#projects" class="btn">View Work</a>
          <a href="#contact" class="btn btn-secondary">Get in Touch</a>
        </div>
      </div>
      <figure class="daily-photo" *ngIf="dailyPhotoUrl() as photoUrl">
        <img [src]="photoUrl" alt="Daily photograph from Anna's collection">
        <figcaption>From my photo collection · changes daily</figcaption>
      </figure>
    </div>
  </div>
</section>
